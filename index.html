<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영화 아카이브</title>
  <!-- 글꼴: 본문용 Pretendard, 분석 글용 Noto Serif KR -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="home">
    <header class="top">
      <a class="name" href="./">영화 아카이브</a>
      <span class="meta" id="count"></span>
    </header>

    <main class="intro">
      <p>줄거리 너머, 장면 하나하나에 숨은 의미를 찾아 기록합니다.<br>한 주에 한 편씩.</p>
    </main>

    <!-- 포스터에 마우스를 올리면 여기에 제목과 한 줄 평이 뜸 -->
    <p class="caption" id="caption" aria-live="polite"></p>

    <!-- 포스터 줄: films.js에 적은 영화가 자동으로 채워짐 -->
    <nav class="shelf" id="shelf" aria-label="영화 목록"></nav>
  </div>

  <script src="films.js"></script>
  <script src="app.js"></script>
</body>
</html>
